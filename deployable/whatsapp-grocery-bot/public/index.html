<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Price Checker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    header p {
      color: #888;
      font-size: 15px;
    }

    .input-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4CAF50;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input::placeholder, textarea::placeholder {
      color: #555;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .input-group {
      flex: 1;
    }

    .row .input-group.small {
      flex: 0 0 160px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    button:hover { background: #45a049; }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      display: none;
    }

    .loading.active { display: block; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: none; }
    .results.active { display: block; }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 20px;
      color: #fff;
    }

    .results-header .items-searched {
      color: #888;
      font-size: 13px;
    }

    .recommendation {
      background: linear-gradient(135deg, #1b3a1b, #0f250f);
      border: 1px solid #2d5a2d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .recommendation h3 {
      font-size: 18px;
      color: #4CAF50;
      margin-bottom: 4px;
    }

    .recommendation p {
      color: #aaa;
      font-size: 14px;
    }

    .platform-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .platform-card.cheapest {
      border-color: #4CAF50;
    }

    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a2a;
    }

    .platform-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .platform-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .platform-dot.swiggy { background: #fc8019; }
    .platform-dot.blinkit { background: #f5c518; }
    .platform-dot.zepto { background: #7b2ff7; }
    .platform-dot.bigbasket { background: #84c225; }

    .platform-name span {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
    }

    .platform-total {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .cheapest-badge {
      background: #4CAF50;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .platform-items {
      padding: 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #1f1f1f;
    }

    .item-row:last-child { border-bottom: none; }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-query {
      font-size: 14px;
      color: #ccc;
      font-weight: 500;
    }

    .item-detail {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .item-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: #4CAF50;
      text-decoration: none;
      transition: color 0.2s;
    }

    .item-link:hover {
      color: #66cc6a;
      text-decoration: underline;
    }

    .item-price {
      text-align: right;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .item-price .price {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .item-price .original-price {
      font-size: 12px;
      color: #666;
      text-decoration: line-through;
      margin-right: 6px;
    }

    .item-price .discount {
      font-size: 11px;
      color: #4CAF50;
    }

    .item-price .not-found {
      font-size: 13px;
      color: #666;
    }

    .error-box {
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      display: none;
      margin-bottom: 24px;
    }

    .error-box.active { display: block; }

    .error-box p {
      color: #ff6b6b;
      font-size: 14px;
    }

    .error-box .error-subtitle {
      color: #888;
      font-size: 13px;
      margin-top: 8px;
    }

    .search-links {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .search-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
      transition: border-color 0.2s, color 0.2s;
    }

    .search-links a:hover {
      border-color: #555;
      color: #fff;
    }

    .search-links .link-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    footer {
      text-align: center;
      padding: 32px 0;
      color: #444;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .row { flex-direction: column; }
      .row .input-group.small { flex: 1; }
      .search-links { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Grocery Price Checker</h1>
      <p>Compare prices across Swiggy Instamart, Blinkit, Zepto &amp; BigBasket</p>
    </header>

    <div class="input-section">
      <div class="input-group">
        <label>Grocery Items</label>
        <textarea id="items" placeholder="Enter items separated by commas&#10;e.g. rice, dal, milk, bread, eggs"></textarea>
      </div>
      <div class="row">
        <div class="input-group">
          <label>City</label>
          <input type="text" id="city" placeholder="Bengaluru" value="Bengaluru">
        </div>
        <div class="input-group small">
          <label>Pincode</label>
          <input type="text" id="pincode" placeholder="560001" maxlength="6">
        </div>
      </div>
      <button id="compareBtn" onclick="comparePrices()">Compare Prices</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">Fetching prices from all platforms...</p>
    </div>

    <div class="error-box" id="error">
      <p id="errorText"></p>
      <p class="error-subtitle" id="errorSubtitle"></p>
      <div class="search-links" id="errorLinks"></div>
    </div>

    <div class="results" id="results">
      <div class="results-header">
        <h2>Price Comparison</h2>
        <span class="items-searched" id="itemsSearched"></span>
      </div>
      <div class="recommendation" id="recommendation" style="display:none">
        <h3 id="recTitle"></h3>
        <p id="recMessage"></p>
      </div>
      <div id="platformCards"></div>
    </div>

    <footer>
      <p>Prices fetched live from platforms. Results may vary by location and availability.</p>
    </footer>
  </div>

  <script>
    const PLATFORM_COLORS = {
      swiggy: '#fc8019',
      blinkit: '#f5c518',
      zepto: '#7b2ff7',
      bigbasket: '#84c225',
    };

    const PLATFORM_NAMES = {
      swiggy: 'Swiggy Instamart',
      blinkit: 'Blinkit',
      zepto: 'Zepto',
      bigbasket: 'BigBasket',
    };

    async function comparePrices() {
      const itemsInput = document.getElementById('items').value.trim();
      const city = document.getElementById('city').value.trim() || 'Bengaluru';
      const pincode = document.getElementById('pincode').value.trim();

      if (!itemsInput) {
        showError('Please enter at least one grocery item.', '');
        return;
      }

      const items = itemsInput.split(',').map(i => i.trim()).filter(i => i.length > 0);
      if (items.length === 0) {
        showError('Please enter valid grocery items separated by commas.', '');
        return;
      }

      if (items.length > 10) {
        showError('Please enter 10 items or fewer.', '');
        return;
      }

      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('error').classList.remove('active');
      document.getElementById('compareBtn').disabled = true;

      try {
        const params = new URLSearchParams();
        params.set('items', items.join(','));
        params.set('city', city);
        if (pincode) params.set('pincode', pincode);

        const response = await fetch(`/api/compare?${params.toString()}`);
        const data = await response.json();

        if (data.error) {
          showError(data.error, '');
          return;
        }

        if (!data.fetched) {
          showError(
            "Couldn't fetch prices from any platform.",
            'The platforms may be blocking automated requests. You can search manually:',
            data.searchLinks,
            items
          );
          return;
        }

        renderResults(data);
      } catch (err) {
        showError('Failed to connect to the server. Please try again.', '');
      } finally {
        document.getElementById('loading').classList.remove('active');
        document.getElementById('compareBtn').disabled = false;
      }
    }

    function showError(message, subtitle, searchLinks, items) {
      document.getElementById('loading').classList.remove('active');
      document.getElementById('compareBtn').disabled = false;
      document.getElementById('error').classList.add('active');
      document.getElementById('errorText').textContent = message;
      document.getElementById('errorSubtitle').textContent = subtitle || '';
      document.getElementById('results').classList.remove('active');

      const linksEl = document.getElementById('errorLinks');
      linksEl.innerHTML = '';

      if (searchLinks && items) {
        for (const [platform, links] of Object.entries(searchLinks)) {
          const color = PLATFORM_COLORS[platform] || '#888';
          const name = PLATFORM_NAMES[platform] || platform;
          // Use the first item's link as a representative search
          const firstLink = links[items[0]] || Object.values(links)[0];
          if (firstLink) {
            linksEl.innerHTML += `<a href="${escapeAttr(firstLink)}" target="_blank" rel="noopener"><span class="link-dot" style="background:${color}"></span>${escapeHtml(name)}</a>`;
          }
        }
      }
    }

    function renderResults(data) {
      document.getElementById('error').classList.remove('active');
      document.getElementById('results').classList.add('active');
      document.getElementById('itemsSearched').textContent = data.query.join(', ');

      // Recommendation
      const rec = data.recommendation;
      const recEl = document.getElementById('recommendation');
      if (rec && rec.savings > 0) {
        recEl.style.display = 'block';
        document.getElementById('recTitle').textContent = `${rec.platform} is the cheapest!`;
        document.getElementById('recMessage').textContent = rec.message;
      } else if (rec) {
        recEl.style.display = 'block';
        document.getElementById('recTitle').textContent = rec.platform;
        document.getElementById('recMessage').textContent = rec.message;
      } else {
        recEl.style.display = 'none';
      }

      const cheapestPlatform = rec ? rec.platform : null;
      const sortedPlatforms = [...data.platforms].sort((a, b) => a.total - b.total);
      const searchLinks = data.searchLinks || {};

      const container = document.getElementById('platformCards');
      container.innerHTML = '';

      for (const platform of sortedPlatforms) {
        const isCheapest = platform.displayName === cheapestPlatform;
        const card = document.createElement('div');
        card.className = `platform-card${isCheapest ? ' cheapest' : ''}`;

        const badgeHtml = isCheapest ? '<span class="cheapest-badge">CHEAPEST</span>' : '';
        const platLinks = searchLinks[platform.platform] || {};

        let itemsHtml = '';
        for (const item of platform.items) {
          const searchUrl = (item.product && item.product.link)
            ? item.product.link
            : (platLinks[item.query] || '#');

          if (item.product) {
            const p = item.product;
            const discountHtml = p.discount ? `<span class="discount">${escapeHtml(p.discount)}</span>` : '';
            const origPriceHtml = p.originalPrice ? `<span class="original-price">\u20B9${p.originalPrice}</span>` : '';
            const brandInfo = p.brand ? ` (${escapeHtml(p.brand)})` : '';
            itemsHtml += `
              <div class="item-row">
                <div class="item-info">
                  <div class="item-query">${escapeHtml(item.query)}</div>
                  <div class="item-detail">${escapeHtml(p.name)}${brandInfo} - ${escapeHtml(p.quantity)}</div>
                  <a class="item-link" href="${escapeAttr(searchUrl)}" target="_blank" rel="noopener">View on ${escapeHtml(platform.displayName)} &rarr;</a>
                </div>
                <div class="item-price">
                  <div class="price">${origPriceHtml}\u20B9${p.price}</div>
                  ${discountHtml}
                </div>
              </div>`;
          } else {
            itemsHtml += `
              <div class="item-row">
                <div class="item-info">
                  <div class="item-query">${escapeHtml(item.query)}</div>
                  <a class="item-link" href="${escapeAttr(searchUrl)}" target="_blank" rel="noopener">Search on ${escapeHtml(platform.displayName)} &rarr;</a>
                </div>
                <div class="item-price">
                  <span class="not-found">Not found</span>
                </div>
              </div>`;
          }
        }

        card.innerHTML = `
          <div class="platform-header">
            <div class="platform-name">
              <div class="platform-dot ${platform.platform}"></div>
              <span>${escapeHtml(platform.displayName)}</span>
              ${badgeHtml}
            </div>
            <div class="platform-total">${platform.total > 0 ? '\u20B9' + platform.total.toFixed(0) : '-'}</div>
          </div>
          <div class="platform-items">${itemsHtml}</div>`;

        container.appendChild(card);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return text.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('items').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        comparePrices();
      }
    });

    document.getElementById('pincode').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') comparePrices();
    });
  </script>
</body>
</html>
