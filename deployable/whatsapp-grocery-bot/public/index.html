<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Price Checker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    header p {
      color: #888;
      font-size: 15px;
    }

    .input-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4CAF50;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input::placeholder, textarea::placeholder {
      color: #555;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .input-group {
      flex: 1;
    }

    .row .input-group.small {
      flex: 0 0 160px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    button:hover { background: #45a049; }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      display: none;
    }

    .loading.active { display: block; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: none; }
    .results.active { display: block; }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 20px;
      color: #fff;
    }

    .results-header .items-searched {
      color: #888;
      font-size: 13px;
    }

    .recommendation {
      background: linear-gradient(135deg, #1b3a1b, #0f250f);
      border: 1px solid #2d5a2d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .recommendation h3 {
      font-size: 18px;
      color: #4CAF50;
      margin-bottom: 4px;
    }

    .recommendation p {
      color: #aaa;
      font-size: 14px;
    }

    .platform-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .platform-card.cheapest {
      border-color: #4CAF50;
    }

    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a2a;
    }

    .platform-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .platform-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .platform-dot.swiggy { background: #fc8019; }
    .platform-dot.blinkit { background: #f5c518; }
    .platform-dot.zepto { background: #7b2ff7; }

    .platform-name span {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
    }

    .platform-total {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .cheapest-badge {
      background: #4CAF50;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .platform-items {
      padding: 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #1f1f1f;
    }

    .item-row:last-child { border-bottom: none; }

    .item-info {
      flex: 1;
    }

    .item-query {
      font-size: 14px;
      color: #ccc;
      font-weight: 500;
    }

    .item-detail {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .item-price {
      text-align: right;
    }

    .item-price .price {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .item-price .discount {
      font-size: 11px;
      color: #4CAF50;
    }

    .item-price .not-found {
      font-size: 13px;
      color: #666;
    }

    .error-box {
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      display: none;
      margin-bottom: 24px;
    }

    .error-box.active { display: block; }

    .error-box p {
      color: #ff6b6b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 32px 0;
      color: #444;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .row { flex-direction: column; }
      .row .input-group.small { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Grocery Price Checker</h1>
      <p>Compare prices across Swiggy Instamart, Blinkit &amp; Zepto</p>
    </header>

    <div class="input-section">
      <div class="input-group">
        <label>Grocery Items</label>
        <textarea id="items" placeholder="Enter items separated by commas&#10;e.g. rice, dal, milk, bread, eggs"></textarea>
      </div>
      <div class="row">
        <div class="input-group">
          <label>City</label>
          <input type="text" id="city" placeholder="Bengaluru" value="Bengaluru">
        </div>
        <div class="input-group small">
          <label>Pincode</label>
          <input type="text" id="pincode" placeholder="560001" maxlength="6">
        </div>
      </div>
      <button id="compareBtn" onclick="comparePrices()">Compare Prices</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Fetching prices from all platforms...</p>
    </div>

    <div class="error-box" id="error">
      <p id="errorText"></p>
    </div>

    <div class="results" id="results">
      <div class="results-header">
        <h2>Price Comparison</h2>
        <span class="items-searched" id="itemsSearched"></span>
      </div>
      <div class="recommendation" id="recommendation" style="display:none">
        <h3 id="recTitle"></h3>
        <p id="recMessage"></p>
      </div>
      <div id="platformCards"></div>
    </div>

    <footer>
      <p>Prices fetched in real-time. Results may vary by location.</p>
    </footer>
  </div>

  <script>
    async function comparePrices() {
      const itemsInput = document.getElementById('items').value.trim();
      const city = document.getElementById('city').value.trim() || 'Bengaluru';
      const pincode = document.getElementById('pincode').value.trim();

      if (!itemsInput) {
        showError('Please enter at least one grocery item.');
        return;
      }

      const items = itemsInput.split(',').map(i => i.trim()).filter(i => i.length > 0);
      if (items.length === 0) {
        showError('Please enter valid grocery items separated by commas.');
        return;
      }

      if (items.length > 10) {
        showError('Please enter 10 items or fewer.');
        return;
      }

      // Show loading
      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('error').classList.remove('active');
      document.getElementById('compareBtn').disabled = true;

      try {
        const params = new URLSearchParams();
        params.set('items', items.join(','));
        params.set('city', city);
        if (pincode) params.set('pincode', pincode);

        const response = await fetch(`/api/compare?${params.toString()}`);
        const data = await response.json();

        if (data.error) {
          showError(data.error);
          return;
        }

        renderResults(data);
      } catch (err) {
        showError('Failed to fetch prices. Please try again.');
      } finally {
        document.getElementById('loading').classList.remove('active');
        document.getElementById('compareBtn').disabled = false;
      }
    }

    function showError(message) {
      document.getElementById('loading').classList.remove('active');
      document.getElementById('compareBtn').disabled = false;
      document.getElementById('error').classList.add('active');
      document.getElementById('errorText').textContent = message;
      document.getElementById('results').classList.remove('active');
    }

    function renderResults(data) {
      document.getElementById('error').classList.remove('active');
      document.getElementById('results').classList.add('active');
      document.getElementById('itemsSearched').textContent = data.query.join(', ');

      // Recommendation
      const rec = data.recommendation;
      const recEl = document.getElementById('recommendation');
      if (rec && rec.savings > 0) {
        recEl.style.display = 'block';
        document.getElementById('recTitle').textContent = `${rec.platform} is the cheapest!`;
        document.getElementById('recMessage').textContent = rec.message;
      } else {
        recEl.style.display = 'none';
      }

      // Find cheapest platform
      const cheapestPlatform = rec ? rec.platform : null;

      // Platform cards
      const container = document.getElementById('platformCards');
      container.innerHTML = '';

      for (const platform of data.platforms) {
        const isCheapest = platform.displayName === cheapestPlatform;
        const card = document.createElement('div');
        card.className = `platform-card${isCheapest ? ' cheapest' : ''}`;

        const badgeHtml = isCheapest ? '<span class="cheapest-badge">CHEAPEST</span>' : '';

        let itemsHtml = '';
        for (const item of platform.items) {
          if (item.product) {
            const p = item.product;
            const discountHtml = p.discount ? `<span class="discount">${p.discount}</span>` : '';
            itemsHtml += `
              <div class="item-row">
                <div class="item-info">
                  <div class="item-query">${escapeHtml(item.query)}</div>
                  <div class="item-detail">${escapeHtml(p.name)} - ${escapeHtml(p.quantity)}</div>
                </div>
                <div class="item-price">
                  <div class="price">\u20B9${p.price}</div>
                  ${discountHtml}
                </div>
              </div>`;
          } else {
            itemsHtml += `
              <div class="item-row">
                <div class="item-info">
                  <div class="item-query">${escapeHtml(item.query)}</div>
                </div>
                <div class="item-price">
                  <span class="not-found">Not found</span>
                </div>
              </div>`;
          }
        }

        card.innerHTML = `
          <div class="platform-header">
            <div class="platform-name">
              <div class="platform-dot ${platform.platform}"></div>
              <span>${escapeHtml(platform.displayName)}</span>
              ${badgeHtml}
            </div>
            <div class="platform-total">\u20B9${platform.total.toFixed(0)}</div>
          </div>
          <div class="platform-items">${itemsHtml}</div>`;

        container.appendChild(card);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enter key support
    document.getElementById('items').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        comparePrices();
      }
    });

    document.getElementById('pincode').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') comparePrices();
    });
  </script>
</body>
</html>
